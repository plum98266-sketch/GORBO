<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>심장지킴이</title>
  <meta name="description" content="반려동물 심장병 홈케어: 수면 호흡수 측정, 투약 체크, 진료 리포트">
  <meta name="theme-color" content="#e8505b">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="pet-switch" class="pet-switch" aria-label="반려동물 선택"></button>
    <button id="open-settings" class="icon-btn" aria-label="설정">⚙︎</button>
  </header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar">
    <button data-tab="home"><span>🏠</span>홈</button>
    <button data-tab="measure"><span>🫁</span>호흡수</button>
    <button data-tab="meds"><span>💊</span>투약</button>
    <button data-tab="log"><span>📝</span>증상</button>
    <button data-tab="report"><span>📋</span>리포트</button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
